name: Test SSH Secret

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH secret
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ SERVER_SSH_KEY IS EMPTY"
            exit 1
          fi

          echo "✅ SERVER_SSH_KEY EXISTS"
          echo "Number of characters: ${#SSH_KEY}"

          echo "$SSH_KEY" | head -n 1
          echo "$SSH_KEY" | tail -n 1